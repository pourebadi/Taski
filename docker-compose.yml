services:
  taski:
    build: .
    container_name: taski
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/apps/api/data/app.db
    volumes:
      - taski_data:/app/apps/api/data

volumes:
  taski_data:
