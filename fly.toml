# fly.toml app configuration file generated for taski on 2026-08-30T01:21:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'taski'
primary_region = 'iad'

[build]

[env]
  DATABASE_URL = 'file:/app/apps/api/data/pe-os.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'taski_data'
  destination = '/app/apps/api/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
